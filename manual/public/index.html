<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14171A">
<title>승강설비 현장조회</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="bar">
  <div class="bar-top">
    <span class="mark" aria-hidden="true"></span>
    <h1>승강설비 현장조회</h1>
    <span id="net" class="net" title="연결 상태"></span>
  </div>
  <div class="field">
    <input id="q" type="search" inputmode="search" autocomplete="off"
           enterkeyhint="search" placeholder="에러코드 또는 증상 입력">
    <button id="clear" type="button" aria-label="입력 지우기" hidden>&#10005;</button>
  </div>
  <div id="chips" class="chips"></div>
</header>

<main id="view" aria-live="polite">
  <p class="empty">코드를 입력하면 의미와 조치가 바로 나옵니다.<br>
  아래 탭에서 절차서와 매뉴얼도 볼 수 있습니다.</p>
</main>

<nav class="tabs" role="tablist">
  <button data-tab="codes" class="on" role="tab">코드</button>
  <button data-tab="procedures" role="tab">절차</button>
  <button data-tab="manuals" role="tab">매뉴얼</button>
  <button data-tab="equipment" role="tab">설비</button>
</nav>

<dialog id="sheet">
  <button id="sheet-close" type="button" aria-label="닫기">&#10005;</button>
  <div id="sheet-body"></div>
</dialog>

<script src="app.js"></script>
</body>
</html>
